name: Naver Booking Monitor

on:
  schedule:
    # Runs twice a day: at 9:00 AM and 9:00 PM KST (00:00 and 12:00 UTC)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows you to manually trigger the run from the GitHub Actions tab

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Naver Booking Checker
      # Pass the GitHub action token to checker.py so it can disable itself
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
      run: python checker.py
