name: Megamart Price Monitor

on:
  schedule:
    # 8:15 AM KST (23:15 UTC of previous day)
    - cron: '15 23 * * *'
    # 9:30 AM KST (00:30 UTC of same day)
    - cron: '30 0 * * *'
    # 11:00 AM KST (02:00 UTC of same day)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows you to manually trigger the run from the GitHub Actions tab

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Korean Fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-nanum

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Megamart Price Checker
      run: python megamart_checker.py

    - name: Commit and Push History
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add history/prices.csv history/price_trend.png README.md dashboard.html history/last_alert_sent.txt || true
        git commit -m "chore: Update price history and trend chart" || echo "No changes to commit"
        git push origin main || echo "No changes to push"
