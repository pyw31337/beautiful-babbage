name: Megamart Price Monitor

on:
  schedule:
    # 1. Critical morning window: Every 30 mins between 7:00 AM and 11:45 AM KST (22:00 UTC - 02:45 UTC)
    # Uses off-peak minutes (15, 45) to bypass GitHub Actions scheduler queue delays.
    - cron: '15,45 22,23,0,1,2 * * *'
    
    # 2. Off-peak hours: Every 2 hours for the rest of the day (at minute 25)
    # KST: 1:25 PM, 3:25 PM, 5:25 PM, 7:25 PM, 9:25 PM, 11:25 PM, 1:25 AM, 3:25 AM, 5:25 AM
    - cron: '25 4,6,8,10,12,14,16,18,20 * * *'
  workflow_dispatch: # Allows you to manually trigger the run from the GitHub Actions tab

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install Korean Fonts
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-nanum

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Megamart Price Checker
      run: python megamart_checker.py

    - name: Commit and Push History
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add history/prices.csv history/price_trend.png README.md dashboard.html || true
        git commit -m "chore: Update price history and trend chart" || echo "No changes to commit"
        git push origin main || echo "No changes to push"
