name: Megamart Price Monitor

on:
  schedule:
    # Runs twice a day: at 9:30 AM and 9:30 PM KST (00:30 and 12:30 UTC)
    - cron: '30 0,12 * * *'
  workflow_dispatch: # Allows you to manually trigger the run from the GitHub Actions tab

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Megamart Price Checker
      run: python megamart_checker.py
